name: sync-ssq
# 双色球周二/四/日 21:15（北京时间）开奖。cron 用 UTC：21:45 BJT = 13:45 UTC，22:30 BJT = 14:30 UTC（同一天）
on:
  schedule:
    - cron: '45 13 * * 0,2,4'
    - cron: '30 14 * * 0,2,4'
  workflow_dispatch:
    inputs:
      delete_extra:
        description: '删除超额账号（默认只禁用）'
        type: boolean
        default: false
concurrency: { group: sync-ssq, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build -w @fucai/core
      - name: sync draws + review tickets + enforce 10-user cap
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/sync.mjs ${{ inputs.delete_extra && '--delete-extra' || '' }}
